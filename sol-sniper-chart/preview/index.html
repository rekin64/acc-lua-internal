<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SOL Sniper chart preview</title>
    <style>
      html, body { margin: 0; background: #01040b; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1920" height="1080"></canvas>
    <script type="module">
      import { buildMarket } from '../src/engine.js';
      import { drawFrame } from '../src/render.js';

      const load = (src) =>
        new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = src;
        });

      const params = new URLSearchParams(location.search);
      const t = parseFloat(params.get('t') ?? '8');
      await Promise.all(['500 28px Inter', '600 46px Inter', '700 50px Inter'].map((f) => document.fonts.load(f)));
      const assets = {
        logo: await load('../public/assets/solsniper-logo.png'),
        token: await load('../public/assets/useless.png'),
      };
      const ctx = document.getElementById('c').getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      const hs = params.get('hs');
      drawFrame(ctx, t, hs ? buildMarket(undefined, Number(hs)) : buildMarket(), assets);
      window.__ready = true;
    </script>
  </body>
</html>
